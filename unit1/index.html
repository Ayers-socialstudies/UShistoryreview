<title>Unit 1 Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one working column (max 760px); sticky top bar with mode + lesson filters; a single
   question card stays in place while content swaps under it. Exam-paper feel: ink text on paper,
   one crimson accent (the same crimson as the printed tests), no decorative cards. */
:root{
  --paper:#fbfaf7; --ink:#1d1a17; --ink-2:#5b5650; --rule:#d9d4cb; --well:#f1eee8;
  --crimson:#8b1e2d; --crimson-ink:#fff; --crimson-soft:#f5e4e7;
  --good:#1f6f3f; --good-soft:#dff0e4; --bad:#9a2a1f; --bad-soft:#f7e1dd;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#17161a; --ink:#ece8e1; --ink-2:#a9a39a; --rule:#3a373f; --well:#232127;
  --crimson:#d9566a; --crimson-ink:#17161a; --crimson-soft:#3a2026;
  --good:#6fcf8f; --good-soft:#1f3a2a; --bad:#f08a7c; --bad-soft:#4a241f; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#17161a; --ink:#ece8e1; --ink-2:#a9a39a; --rule:#3a373f; --well:#232127;
  --crimson:#d9566a; --crimson-ink:#17161a; --crimson-soft:#3a2026;
  --good:#6fcf8f; --good-soft:#1f3a2a; --bad:#f08a7c; --bad-soft:#4a241f; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--crimson);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
.brand h1 small{font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson);display:block}
.modes{display:flex;gap:4px;background:var(--well);border-radius:999px;padding:3px}
.modes button{padding:6px 14px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--crimson);color:var(--crimson-ink)}
.lessons{display:flex;gap:6px;flex-wrap:wrap}
.lessons button{padding:4px 10px;border:1px solid var(--rule);border-radius:6px;font-size:.88rem;color:var(--ink-2);background:var(--paper)}
.lessons button[aria-pressed="true"]{border-color:var(--crimson);color:var(--crimson);background:var(--crimson-soft);font-weight:600}

main .wrap{padding-block:20px 48px}
.setup{display:flex;flex-direction:column;gap:18px}
.setup h2{font-family:var(--display);font-size:1.7rem;margin:0;text-wrap:balance}
.setup p{margin:0;color:var(--ink-2);max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;border:1px solid var(--rule);border-radius:6px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:var(--crimson);color:var(--crimson-ink);border-radius:8px;font-weight:700;font-size:1.05rem}
.cta.secondary{background:transparent;color:var(--crimson);border:2px solid var(--crimson)}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border-top:2px solid var(--rule);padding-top:8px}
.stat b{font-family:var(--display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:.9rem}

.progress{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar{height:4px;background:var(--well);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--crimson);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.tag{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--crimson)}
.stem{font-family:var(--display);font-size:1.28rem;line-height:1.4;margin:6px 0 20px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);line-height:1.35}
.opt .k{font-weight:700;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:.9rem;color:var(--ink-2)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:18px;padding:12px 14px;border-left:3px solid var(--rule);background:var(--well);border-radius:0 8px 8px 0}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.feedback .t{color:var(--ink-2);font-size:.92rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.kbd{margin-left:auto;font-size:.78rem;color:var(--ink-2)}
kbd{font-family:var(--body);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78rem}

.card{border:1.5px solid var(--rule);border-radius:10px;padding:26px 22px;min-height:240px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;background:var(--paper);width:100%;text-align:left}
.card .side{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.card.back{border-color:var(--crimson)}
.card.back .side{color:var(--crimson)}
.card .ans{font-family:var(--display);font-size:1.35rem;line-height:1.35}
.card .stem{margin:0}
.card .t{margin-top:14px;color:var(--ink-2);font-size:.92rem}
.judge{display:flex;gap:10px;margin-top:16px}
.judge button{flex:1;padding:12px;border-radius:8px;font-weight:700;border:1.5px solid var(--rule)}
.judge .miss{color:var(--bad)} .judge .got{color:var(--good)}
.judge .miss:not([disabled]):hover{background:var(--bad-soft);border-color:var(--bad)}
.judge .got:not([disabled]):hover{background:var(--good-soft);border-color:var(--good)}

.results h2{font-family:var(--display);font-size:1.9rem;margin:0 0 4px}
.score{font-family:var(--display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:1.1rem;color:var(--ink-2);font-family:var(--body)}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
th{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
td.n{text-align:right}
.weak td{color:var(--bad);font-weight:600}
.missedlist{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.missedlist li{padding:10px 12px;border-left:3px solid var(--bad);background:var(--well);border-radius:0 8px 8px 0;font-size:.95rem}
.missedlist li b{display:block;color:var(--good);margin-top:4px}
footer{color:var(--ink-2);font-size:.82rem;border-top:1px solid var(--rule);padding-top:14px;margin-top:40px}
footer button{text-decoration:underline;color:var(--ink-2)}
</style>

<script>
const DATA = [{"id":1,"l":"1.1","q":"The nations of the Haudenosaunee Confederacy each governed their own local affairs but sent chiefs to the Grand Council to decide matters that affected all five nations — a union symbolized by five arrows bound together. Which principle of government does this arrangement best illustrate?","o":["Federalism","Separation of powers","Popular sovereignty","Limited government"],"a":0,"t":"Federalism"},{"id":2,"l":"1.1","q":"Under the Great Law of Peace, a chief who ignored the law and stopped serving the people’s welfare received warnings and could then be removed from office by the clan mothers. This process reflects which belief about political power?","o":["Political power is a possession that a leader keeps for life","Political power comes from the people, who can take it back","Political power passes automatically from a chief to his son","Political power belongs to whoever commands the most warriors"],"a":1,"t":"Limited government & popular sovereignty"},{"id":3,"l":"1.1","q":"In the Grand Council, proposals passed between the Elder Brothers (Mohawk and Seneca) and the Younger Brothers (Oneida and Cayuga) before the Onondaga Firekeepers confirmed the decision or broke a tie. What was the main purpose of this multi-step process?","o":["To speed up decision-making during emergencies","To prevent any single nation from controlling the council","To allow the largest nation to cast the deciding vote","To keep the details of council decisions secret"],"a":1,"t":"Checks and balances / separation of powers"},{"id":4,"l":"1.1","q":"Tadodaho, the feared Onondaga war chief pictured with snakes in his hair, was the last leader to accept the Great Peace. Rather than being defeated in battle, he was transformed and made presiding chief of the Grand Council — a title that still carries his name today. What does this outcome suggest about the Peacemaker’s approach to powerful opponents?","o":["Opponents were exiled from Iroquoia once peace was declared","Opponents were stripped of all their titles as punishment","Opponents could be brought into the new government with honor","Opponents were required to pay wampum before they could join"],"a":2,"t":"Tadodaho"},{"id":5,"l":"1.1","q":"Which contribution to the founding of the Great Peace is credited to Hiawatha?","o":["Planting the Tree of Great Peace at Onondaga Lake","Serving as the first person to accept the Great Peace","Presiding over the Grand Council as its lead chief","Creating the Condolence Ceremony to heal grief"],"a":3,"t":"Hiawatha"},{"id":6,"l":"1.1","q":"Jigonhsasee is honored as the “Mother of Nations” because she was the first person to accept the Great Peace. According to Haudenosaunee tradition, what lasting result came from her acceptance?","o":["Women gained the power to select and remove chiefs","Women became the Confederacy’s leading war chiefs","Her home village became the Confederacy’s capital","Her clan was excused from serving on the council"],"a":0,"t":"Jigonhsasee & the clan mothers"},{"id":7,"l":"1.1","q":"The Confederacy described its five nations as families living together in a single longhouse, with the Mohawk as Keepers of the Eastern Door and the Seneca as Keepers of the Western Door. In this metaphor, which nation served as the Firekeepers at the center?","o":["Mohawk","Seneca","Onondaga","Cayuga"],"a":2,"t":"The Longhouse"},{"id":8,"l":"1.1","q":"The English phrase “bury the hatchet” traces back to an event in Haudenosaunee history. What happened at Onondaga Lake that gave rise to this phrase?","o":["Weapons of war were buried beneath the Tree of Great Peace","A hatchet was thrown into the lake to declare a new war","Hunting tools were stored underground during each winter","Wampum belts were buried to record an important treaty"],"a":0,"t":"Onondaga Lake"},{"id":9,"l":"1.1","q":"The Haudenosaunee Confederacy originally united five nations: the Mohawk, Oneida, Onondaga, Cayuga, and Seneca. It became known as the Six Nations when which nation joined around 1722?","o":["Wendat (Huron)","Erie","Susquehannock","Tuscarora"],"a":3,"t":"The Five (later Six) Nations"},{"id":10,"l":"1.1","q":"A modern city council is debating whether to cut down an old forest to build a shopping center that would create jobs for about ten years. If the council followed the Haudenosaunee Seventh Generation Principle, which question would it ask first?","o":["Which choice will win the most votes in the next election?","How quickly can the project begin earning the city money?","How will this decision affect people living far in the future?","What did the city’s founders decide about this land long ago?"],"a":2,"t":"The Seventh Generation Principle"},{"id":11,"l":"1.1","q":"The Haudenosaunee Confederacy formed centuries before European contact, but researchers debate the exact date. Scholars who date the founding to 1142 CE combined Haudenosaunee oral tradition about a darkened sky over Ganondagan with which type of scientific evidence?","o":["Tree-ring dating of ancient longhouse posts","Astronomical records of solar eclipses","DNA studies of Iroquoian populations","Carbon dating of preserved wampum shells"],"a":1,"t":"The founding date debate"},{"id":12,"l":"1.1","q":"Historians disagree about how much the Haudenosaunee Confederacy influenced the U.S. Constitution. Which piece of evidence would BEST support the claim that the American founders knew about the Confederacy’s system of government?","o":["Both governments held their meetings in a central capital","Both governments wrote their constitutions down from the start","The U.S. Senate passed a resolution crediting the Confederacy in 1988","Benjamin Franklin attended treaty councils with the Haudenosaunee"],"a":3,"t":"The influence debate"},{"id":13,"l":"1.2","q":"The English Separatists who founded Plymouth Colony believed the Church of England could not be fixed from within. What set the Separatists apart from other Puritans?","o":["They wanted to return the church to its Catholic traditions","They wanted to break away from the Church of England entirely","They wanted the king to take personal control of the church","They wanted to reform the church while remaining inside it"],"a":1,"t":"The Pilgrims (Separatists)"},{"id":14,"l":"1.2","q":"The Puritans earned their name from their central religious goal. What did the Puritans hope to do?","o":["Establish a brand-new religion separate from Christianity","Restore the authority of the Pope over the English church","“Purify” the Church of England of its remaining Catholic elements","Convert the Indigenous peoples of New England to their faith"],"a":2,"t":"The Puritans"},{"id":15,"l":"1.2","q":"Unlike Plymouth, Jamestown (1607) was established by the Virginia Company and survived its early years largely through help from the nearby Powhatan people. What was the main purpose behind Jamestown’s founding?","o":["Earning profit for the company’s investors","Escaping religious persecution back in England","Spreading Puritan beliefs to a new continent","Testing out a new form of self-government"],"a":0,"t":"Jamestown (1607)"},{"id":16,"l":"1.2","q":"Storms pushed the Mayflower far north of its destination, and the Pilgrims landed at Cape Cod in 1620. Why did this landing spot create a serious legal problem for the settlers?","o":["The land already belonged to the Dutch colony of New Netherland","King James had forbidden any settlement in New England","The Virginia Company ordered them to sail back to England","They were outside their charter’s territory, with no legal government"],"a":3,"t":"Plymouth Colony: the squatter problem"},{"id":17,"l":"1.2","q":"The Mayflower Compact created a government based on the settlers’ own agreement — yet its signers called themselves “Loyal Subjects” of King James. What does this combination suggest about the Compact?","o":["It was a declaration of independence from England","It created self-government without rejecting the king’s authority","It was written mainly to impress officials back in London","It gave King James direct control over the colony’s laws"],"a":1,"t":"The Mayflower Compact"},{"id":18,"l":"1.2","q":"In the Compact, the settlers promise to “covenant and combine ourselves together into a civil Body Politick.” As used here, the word covenant most nearly means —","o":["make a binding promise before God and each other","sign a business contract with the Virginia Company","declare a truce between two warring groups","draw up a map dividing the colony’s land"],"a":0,"t":"Covenant / civil body politic"},{"id":19,"l":"1.2","q":"Adult male indentured servants such as George Soule and Edward Doty were among the Compact’s 41 signers. Why did the Pilgrim leaders need the servants to sign?","o":["English law required every adult passenger to sign any colonial charter","The servants were the only passengers aboard who could read and write","Servants claimed their contracts were void, so their consent was needed for unity","The Virginia Company refused to recognize laws unless servants approved them"],"a":2,"t":"Majority rule: who was in, who was out"},{"id":20,"l":"1.2","q":"A student reads the Mayflower Compact and asks: “Who wrote this document, and what were they trying to accomplish?” Which historical thinking skill is the student using?","o":["Sourcing","Corroboration","Close reading","Contextualization"],"a":0,"t":"The four historical thinking skills"},{"id":21,"l":"1.2","q":"A poor young Englishman in 1630 cannot afford the voyage to America. He agrees to work for a colonist for five years, and in exchange his passage across the ocean is paid. Which term best describes his status?","o":["Freeman of the colony","Separatist","Squatter","Indentured servant"],"a":3,"t":"Indentured servitude"},{"id":22,"l":"1.2","q":"Aboard the Arbella in 1630, John Winthrop told the Puritans that “the eyes of all people are upon us.” What was Winthrop’s main point?","o":["Spies sent from England were watching the colony’s every move","The colony should be a model community for the world to watch","The Indigenous nations of New England surrounded the settlement","The colonists should keep their religious practices hidden"],"a":1,"t":"“A City upon a Hill”"},{"id":23,"l":"1.2","q":"John Cotton’s 1630 sermon argued that God had “made room” for English settlers in New England. How do historians today read this sermon?","o":["As proof that the land was truly empty when the settlers arrived","As a legal contract between England and the Indigenous nations","As a religious justification colonists used for taking Indigenous land","As evidence that Cotton opposed the colonization of New England"],"a":2,"t":"Religious justification for taking land"},{"id":24,"l":"1.2","q":"Historians call the Mayflower Compact a “stepping stone” to the U.S. Constitution. Which feature of the Compact BEST supports that claim?","o":["Its pledge of loyalty to the English king","Its promise to advance the Christian faith","Its long list of forty-one signatures","Its creation of government by the settlers’ own consent"],"a":3,"t":"Stepping stone to the Constitution"},{"id":25,"l":"1.3","q":"A pamphlet writer declares that no ruler stands above the law: “the law is king.” Which principle is this?","o":["The divine right of kings","Parliamentary sovereignty","The rule of law","Natural rights"],"a":2,"t":"Rule of law"},{"id":26,"l":"1.3","q":"The Declaration of Independence rests on the belief that all people are born with rights that no government can take away. This belief is called:","o":["Natural rights","The divine right of kings","Parliamentary sovereignty","The rule of law"],"a":0,"t":"Natural rights"},{"id":27,"l":"1.3","q":"Who authored the Declaration of Independence in July 1776?","o":["Thomas Paine","Thomas Jefferson","Paul Revere","King George III"],"a":1,"t":"Thomas Jefferson"},{"id":28,"l":"1.3","q":"Paul Revere published an engraving of the Boston Massacre that deliberately distorted the event to win support for the rebellion. His engraving is an example of:","o":["Propaganda","Monopoly","Boycott","Natural rights"],"a":0,"t":"Boston Massacre & propaganda"},{"id":29,"l":"1.3","q":"To fight the Stamp Act and the Townshend Acts, colonists refused to buy British goods until Parliament backed down. This form of protest is a:","o":["Monopoly","Massacre","Proclamation","Boycott"],"a":3,"t":"Boycott: Stamp & Townshend Acts"},{"id":30,"l":"1.3","q":"Under which idea does a monarch’s authority come directly from God, making the king himself the law?","o":["The rule of law","The divine right of kings","Natural rights","Parliamentary sovereignty"],"a":1,"t":"Divine right of kings"},{"id":31,"l":"1.3","q":"The Proclamation of 1763 angered many colonists because it:","o":["Taxed all legal documents in the colonies","Closed Boston Harbor to all trade","Banned colonial settlement west of the Appalachians","Forced colonists to house British soldiers"],"a":2,"t":"Proclamation of 1763"},{"id":32,"l":"1.3","q":"In the Coercive Acts, Britain closed Boston Harbor and shut down Massachusetts’s legislature and town meetings. To many colonists, this showed that Britain was:","o":["Protecting their natural rights","Lowering the price of imported tea","Granting them seats in Parliament","Taking away their self-government"],"a":3,"t":"Coercive Acts"},{"id":33,"l":"1.3","q":"Paine argued that male and female is a distinction of nature, but that dividing people into kings and subjects has no natural basis. What was his point about nobility?","o":["It is a human invention, not a law of nature","It is a gift granted directly by God","It is the true protector of common people","It comes from the consent of the governed"],"a":0,"t":"Equality vs. nobility"},{"id":34,"l":"1.3","q":"A modern ruler claims he cannot be put on trial because God chose him to lead. Which idea from this unit most directly rejects his claim?","o":["The divine right of kings","The rule of law","Parliamentary sovereignty","The tea monopoly"],"a":1,"t":"Rule of law"},{"id":35,"l":"1.3","q":"Which statement BEST shows that Paine attacked monarchy itself, not just unfair taxes?","o":["He listed the exact amount colonists paid in each tax","He described how tea was shipped into the colonies","He praised Parliament for repealing the Stamp Act in 1766","He wrote that kings and subjects have no natural basis"],"a":3,"t":"Reconciliation vs. independence"},{"id":36,"l":"1.3","q":"The British believed no single written document limited their government and that Parliament held supreme power over all law. This idea is called:","o":["The divine right of kings","Natural rights","Parliamentary sovereignty","The rule of law"],"a":2,"t":"Parliamentary sovereignty"},{"id":37,"l":"1.4","q":"This plan of government had a one-branch Congress with no power to tax and no way to enforce its laws. Nine of thirteen states had to agree to pass a major law, and all thirteen had to agree to change it. This describes:","o":["the Constitution of 1787","the Articles of Confederation","the Great Law of Peace","the English Bill of Rights"],"a":1,"t":"Articles of Confederation"},{"id":38,"l":"1.4","q":"During Shays’ Rebellion (1786–87), Congress had no army and no money to respond, so Massachusetts had to hire a private force to stop the uprising. What did this reveal to leaders across the country?","o":["The central government was too weak to keep order","The state governments were too strong to be defeated","The farmers wanted to return to British rule","The Articles were working as their writers intended"],"a":0,"t":"Shays’ Rebellion"},{"id":39,"l":"1.4","q":"Under this system, the states are sovereign and the central government can only ask them for money and soldiers. Laws bind the states, not the people. This system is a:","o":["federal union","republic","confederation","monarchy"],"a":2,"t":"Confederation vs. federal union"},{"id":40,"l":"1.4","q":"The Constitution opens with the words “We the People,” citizens elect Congress, and the document could not take effect until conventions of the people approved it. The structure of democracy these facts illustrate is:","o":["federalism","ratification","popular sovereignty","representative democracy"],"a":2,"t":"Popular sovereignty"},{"id":41,"l":"1.4","q":"Under the Constitution, the national government handles foreign policy and trade between states, while the states handle schools and local police — and the Tenth Amendment reserves unlisted powers to the states or the people. Power divided this way is called:","o":["separation of powers","checks and balances","limited government","federalism"],"a":3,"t":"Federalism"},{"id":42,"l":"1.4","q":"Which founder introduced, in the first Congress of 1789, the amendments that became the Bill of Rights?","o":["James Madison","Alexander Hamilton","Patrick Henry","John Jay"],"a":0,"t":"James Madison"},{"id":43,"l":"1.4","q":"In Federalist No. 84, Hamilton argued that adding a bill of rights could actually be dangerous. What was his reasoning?","o":["Listing rights would make the document too long for the states to approve","Listing some rights could imply the government had powers it was never given","Listing rights would give the states permission to ignore federal laws","Listing rights would weaken the president’s power to veto a law"],"a":1,"t":"Hamilton & Federalist No. 84"},{"id":44,"l":"1.4","q":"This side trusted the state governments closest to the people, feared the “Necessary and Proper” and Supremacy clauses as loopholes for unlimited power, and refused to support the Constitution without a written bill of rights. This side was:","o":["the Federalists","the Philadelphia delegates","the Anti-Federalists","the Loyalists"],"a":2,"t":"Federalists vs. Anti-Federalists"},{"id":45,"l":"1.4","q":"According to Madison in Federalist No. 10, why would a large republic control factions better than a direct democracy could?","o":["Representatives filter public views, and many competing factions balance one another","Every citizen gets a direct vote on every proposed law, so no faction is ever left out","The president has the power to outlaw any faction that forms in the country","Factions are prevented from ever organizing in the first place by the courts"],"a":0,"t":"Faction & Federalist No. 10"},{"id":46,"l":"1.4","q":"The president vetoes a bill. Congress votes again and passes it with a two-thirds majority, so it becomes law without the president’s signature. This is a modern example of:","o":["federalism","popular sovereignty","ratification","checks and balances"],"a":3,"t":"Checks and balances"},{"id":47,"l":"1.4","q":"The Ninth Amendment says that listing certain rights in the Constitution “shall not be construed to deny or disparage others retained by the people.” Which fear from the ratification debate does this amendment answer?","o":["The Anti-Federalist fear that the national government would overpower the states","Hamilton’s fear that listing some rights implies power over all the rest","Madison’s fear that a majority faction would oppress the minority","Paine’s fear that kings would keep claiming to rule by divine right"],"a":1,"t":"The Bill of Rights (Ninth Amendment)"},{"id":48,"l":"1.4","q":"A Federalist claims: “A strong central government was necessary, not dangerous.” Which piece of evidence BEST supports this claim?","o":["New York’s ratifying convention approved the Constitution by a vote of 30–27","Alexander Hamilton organized the Federalist Papers and wrote 51 of the essays","Every state constitution, and even Britain, already listed rights in writing","Under the Articles, Congress had no army and no money to respond to Shays’ Rebellion"],"a":3,"t":"Why a strong central government"},{"id":49,"l":"1.5","q":"In the years before 1828, states dropped the rule that a man had to own property in order to vote. Poor farmers, dock workers, and frontier settlers cast ballots for the first time, and turnout in presidential elections jumped from 27 percent to 80 percent. Which Key Idea does this describe?","o":["Expanding White Male Suffrage","Republican Motherhood","The spoils system","The 15th Amendment & Black Male Suffrage"],"a":0,"t":"Expanding white male suffrage"},{"id":50,"l":"1.5","q":"Once poor white men could vote, Congress passed the Indian Removal Act and Georgia gave away Cherokee land by lottery. Once Black men could vote, the South built its first public schools. Once women could vote, Congress passed the first federal child-health law. Which Key Idea ties these three examples together?","o":["The “Common Man” Debate","The Vote Changes What Government Does","Slavery Splits the Electorate (1820–1861)","Reconstruction & the Vote Taken Back"],"a":1,"t":"The vote changes what government does"},{"id":51,"l":"1.5","q":"By 1828 the Cherokee had a written constitution, a written language, a newspaper, farms, and schools — everything the United States had said would make a people “civilized.” They were removed from their land anyway. What does this suggest about the test for who counted as an American?","o":["The Cherokee had failed to adopt the practices the United States had demanded of them","Georgia removed the Cherokee because they refused to farm, build schools, or write laws","The Supreme Court had ruled that the Cherokee were not yet civilized enough to qualify for citizenship","Being counted depended on political power — the ballot — not on meeting a “civilization” test"],"a":3,"t":"The Cherokee Nation & New Echota"},{"id":52,"l":"1.5","q":"Jackson’s voters — small farmers, settlers, and gold-seekers — wanted cheap acres in Georgia. The Cherokee, led by John Ross, wanted to keep the farms, capital, and government they had built. Both sides made their case. According to the lesson, what decided the outcome?","o":["The Cherokee’s legal argument was weaker than Georgia’s","The Supreme Court sided with Georgia in every case it heard","One side had ballots and the other side did not","The Cherokee agreed to sell the land in a treaty their government approved"],"a":2,"t":"Poor white men’s interests vs. Cherokee interests"},{"id":53,"l":"1.5","q":"In Worcester v. Georgia (1832) the Supreme Court ruled that Georgia’s laws over the Cherokee were void. How did President Jackson respond?","o":["He refused to enforce the Court’s ruling","He sent federal troops to protect the Cherokee from Georgia","He asked Congress to repeal the Indian Removal Act","He negotiated a treaty that let the Cherokee stay on their land"],"a":0,"t":"Indian Removal & the Trail of Tears"},{"id":54,"l":"1.5","q":"Abraham Lincoln won the Election of 1860 with about 40 percent of the popular vote and not a single Southern state. Eleven Southern states seceded rather than accept the result. What does the lesson say voting could and could not do in 1860?","o":["It ended slavery in the territories but not in the Southern states","It gave the Southern states the legal right to leave the Union peacefully","It settled who would be a citizen but not who would be president","It decided the election but could not decide who counted as an American"],"a":3,"t":"Slavery splits the electorate"},{"id":55,"l":"1.5","q":"In 1857 Chief Justice Roger Taney ruled that Black people, free or enslaved, were “not included… under the word ‘citizens’” in the Constitution and never could be. Which Supreme Court decision was this?","o":["Cherokee Nation v. Georgia","Dred Scott v. Sandford","Worcester v. Georgia","Minor v. Happersett"],"a":1,"t":"Dred Scott v. Sandford"},{"id":56,"l":"1.5","q":"In his 1852 speech, Frederick Douglass told his Rochester audience, “This Fourth of July is yours, not mine.” What was his central argument?","o":["Independence Day should be moved to a date that honored the enslaved rather than the founders","The Northern states should separate from the slaveholding South","A nation’s celebration of liberty is hollow to those it defines out of “the people”","Enslaved people should be given a separate national holiday of their own"],"a":2,"t":"“What to the Slave Is the Fourth of July?”"},{"id":57,"l":"1.5","q":"The 14th Amendment (1868) made everyone born in the United States a citizen with equal protection under the law — but excluded “Indians not taxed.” What did this fine print mean for the Cherokee?","o":["They were still outside the Constitution’s definition of an American","They became citizens but had to pay a special federal tax to keep that status","They gained the right to vote but not the right of citizenship","They were counted as citizens only if they returned to Georgia"],"a":0,"t":"The Civil War Amendments"},{"id":58,"l":"1.5","q":"With the ballot, Black Southerners elected about 2,000 officeholders and built the South’s first public schools. After poll taxes and literacy tests cut Louisiana’s Black registration from about 130,000 to under 1,500, the schools were starved and legal protections vanished. Which lesson does this illustrate?","o":["Groups that win the vote keep their gains permanently","Public schools depended on federal money rather than on the votes of local residents","The 15th Amendment was repealed by Southern states in the 1890s","Lose the ballot, lose the government’s attention — the Cherokee lesson in reverse"],"a":3,"t":"Reconstruction & the vote taken back"},{"id":59,"l":"1.5","q":"A modern city must choose where to build a waste facility. It picks the one neighborhood where most residents are not citizens and cannot vote. Which lesson from this unit BEST applies?","o":["The “Common Man” Debate shows that elected leaders always favor the interests of the poor","Exclusion from the ballot shapes what a government is willing to do, and to whom","Compromises delay conflicts without ever resolving them","Citizenship automatically guarantees a voice in government"],"a":1,"t":"The vote changes what government does"},{"id":60,"l":"1.5","q":"A historian claims that Andrew Jackson was a power-hungry tyrant rather than a champion of the common man. Which piece of evidence BEST supports this claim?","o":["He was the first president who grew up poor","He favored rotating ordinary citizens through jobs in the federal government","He defied the Supreme Court to force the Cherokee from their land","Voter turnout rose sharply during his era"],"a":2,"t":"The “Common Man” debate"},{"id":61,"l":"1.5","q":"After the American Revolution, a new ideology encouraged women to become educated and to care about politics — but only so they could raise good democratic sons, while their “place” remained in the home. Which Key Idea does this describe?","o":["The Declaration of Sentiments","Anti-Suffrage Arguments","Republican Motherhood","The “Home Protection” Ballot"],"a":2,"t":"Republican Motherhood"},{"id":62,"l":"1.5","q":"The 19th Amendment was ratified in 1920 when Tennessee became the decisive 36th state. By what margin did ratification pass in Tennessee?","o":["By a unanimous vote of the legislature","By roughly one hundred votes","By thirty-six votes","By a single vote"],"a":3,"t":"The 19th Amendment"},{"id":63,"l":"1.5","q":"In 1872 Susan B. Anthony registered and voted in Rochester, then argued at her trial that the Constitution says “We, the people,” not “we, the white male citizens.” What point was she making?","o":["Women were already part of “the people” — the nation was denying an existing right","The Constitution was so deeply flawed that the whole document needed to be rewritten from scratch","Only women who owned property should count as “the people”","Each state, not the national government, should decide who received the ballot"],"a":0,"t":"Susan B. Anthony"},{"id":64,"l":"1.5","q":"In 1875 the Supreme Court ruled that women were citizens under the 14th Amendment — but that citizenship did not include the right to vote. Which decision was this?","o":["Dred Scott v. Sandford","Minor v. Happersett","Cherokee Nation v. Georgia","Worcester v. Georgia"],"a":1,"t":"Minor v. Happersett"},{"id":65,"l":"1.5","q":"The Court had now given three answers to “who counts?” The Cherokee were a dependent nation, not citizens. Black Americans, before the war, were not citizens. Women were citizens — but citizenship carried no vote. What new category did the women’s ruling create?","o":["A foreign nation living entirely inside the borders of the United States","A group that could vote but could not hold public office","A group that was neither a citizen nor a voter","An American who is one of “the people” but has no say in the government"],"a":3,"t":"Three answers to “who counts?”"},{"id":66,"l":"1.5","q":"A husband could drink away the family’s wages, and in most states a wife had few property rights and little access to divorce. Frances Willard argued that women therefore needed the vote in order to protect their homes. Which Key Idea does this describe?","o":["The “Home Protection” Ballot","Republican Motherhood","NAWSA & the Two-Strategy Campaign","Anti-Suffrage Arguments"],"a":0,"t":"The “Home Protection” ballot"},{"id":67,"l":"1.5","q":"Brewers and distillers became the biggest funders of anti-suffrage campaigns. Why?","o":["They believed women voters would vote to keep the saloons open","They feared women voters would raise taxes on all businesses","They expected women voters to pass prohibition","They believed only men should hold jobs in the brewing industry"],"a":2,"t":"Anti-suffrage arguments"},{"id":68,"l":"1.5","q":"Washington women won the right to vote in 1910. What did Washington voters do four years later, in 1914?","o":["Repealed woman suffrage","Passed statewide prohibition","Elected the first woman governor in the nation","Ratified the 19th Amendment"],"a":1,"t":"Washington State"},{"id":69,"l":"1.5","q":"NAWSA worked to win the vote state by state and to pass a constitutional amendment. Alice Paul’s National Woman’s Party, founded in 1916, added a third approach. What was it?","o":["Boycotting elections and refusing to pay federal taxes","Suing in the federal courts to overturn the Court’s ruling in Minor v. Happersett","Seeking a compromise with the leading anti-suffrage groups","Picketing the White House and heckling politicians — “un-ladylike” tactics"],"a":3,"t":"Alice Paul & NAWSA"},{"id":70,"l":"1.5","q":"Molly Elliot Seawell argued in The Ladies’ Battle (1911) that a woman could be a full citizen without being a voter, since men alone would have to enforce the laws. Whose logic did Seawell’s argument match?","o":["The Supreme Court’s in Minor v. Happersett","Susan B. Anthony’s in “On Women’s Right to Vote”","Frederick Douglass’s in “What to the Slave Is the Fourth of July?”","The Declaration of Sentiments at Seneca Falls"],"a":0,"t":"Molly Elliot Seawell"},{"id":71,"l":"1.5","q":"A city lowers its voting age to 16 for local elections. Within two years, the city council funds new school buses and a teen center it had refused to fund for a decade. Which lesson from this unit BEST explains the change?","o":["Republican Motherhood — leaders were preparing young people for their future citizenship","NAWSA’s two-strategy campaign — change comes fastest at the local level","The vote changes what government does — leaders serve people who can vote them out","Anti-suffrage arguments — new voters are too inexperienced to be trusted"],"a":2,"t":"The vote changes what government does"},{"id":72,"l":"1.5","q":"A student claims: “By 1870 the 14th Amendment had settled the question of who counted as an American.” Which fact from this unit BEST challenges that claim?","o":["Tennessee ratified the 19th Amendment by a single vote in its House","Native Americans were not made citizens until 1924","Washington passed statewide prohibition in 1914","NAWSA was founded in 1890 by Susan B. Anthony and Elizabeth Cady Stanton"],"a":1,"t":"The Indian Citizenship Act"},{"id":73,"l":"1.6","q":"A Soviet-style system in which the government owns property and industry “in the name of the workers,” and a single party holds all political power, is called:","o":["capitalism","communism","fascism","democracy"],"a":1,"t":"Communism"},{"id":74,"l":"1.6","q":"In the 1930s, dictatorships in Germany and Italy were built on extreme nationalism, military power, and the crushing of all opposition. This system is called:","o":["fascism","communism","capitalism","socialism"],"a":0,"t":"Fascism & totalitarianism"},{"id":75,"l":"1.6","q":"In 1941, FDR proposed that the United States stay out of combat but supply the fighting democracies with “ships, planes, tanks, guns.” This policy is known as:","o":["the Four Freedoms","the New Deal","the “arsenal of democracy”","proxy warfare"],"a":2,"t":"“Arsenal of democracy”"},{"id":76,"l":"1.6","q":"Again and again in his Four Freedoms passage, FDR repeated the phrase “everywhere in the world.” What does this repetition suggest about his argument?","o":["The freedoms were meant to protect only American citizens","These rights belong to all people, not just to Americans","The United States planned to declare war immediately","The freedoms had already been achieved in most of the world"],"a":1,"t":"The Four Freedoms"},{"id":77,"l":"1.6","q":"In his 1961 Inaugural Address, JFK pledged that America would “pay any price, bear any burden… to assure the survival and the success of liberty.” This pledge is best described as:","o":["an interventionist promise to defend freedom abroad","an isolationist promise to stay out of foreign conflicts","a disarmament promise to end the nuclear arms race","a domestic promise to end the Great Depression"],"a":0,"t":"“Pay any price, bear any burden”"},{"id":78,"l":"1.6","q":"In Korea and Vietnam, the United States and the Soviet Union backed opposing sides rather than fighting each other directly. These conflicts are examples of:","o":["world wars","wars of attrition","total wars","proxy wars"],"a":3,"t":"Cold War & proxy wars"},{"id":79,"l":"1.6","q":"Unlike the wars in Korea and Vietnam, the 1962 Cuban Missile Crisis is best described as:","o":["a direct standoff between the two superpowers themselves","another proxy war fought through smaller allied nations","a conflict that permanently ended the Cold War rivalry","a land battle fought mainly with American ground troops"],"a":0,"t":"Cuba"},{"id":80,"l":"1.6","q":"Which event ended the American debate over neutrality and brought the United States into World War II?","o":["the outbreak of the Korean War","FDR’s Four Freedoms speech","the attack on Pearl Harbor","the Cuban Missile Crisis"],"a":2,"t":"Pearl Harbor"},{"id":81,"l":"1.6","q":"In the 1950s, Americans who criticized society or supported civil rights were sometimes accused of sounding “like communists.” This wave of fear is known as:","o":["the Cold War","isolationism","totalitarianism","the Red Scare"],"a":3,"t":"Red Scare"},{"id":82,"l":"1.6","q":"FDR called America a “perpetual peaceful revolution,” and JFK said its glow “can truly light the world.” These images show that, during the 20th century, American democracy functioned as:","o":["an economic policy for ending depressions","a military strategy for winning proxy wars","a symbol of national identity and purpose","a legal code enforced by federal courts"],"a":2,"t":"Democracy as a symbol"},{"id":83,"l":"1.6","q":"Imagine that a senator today argues the United States should stop sending military aid overseas and spend that money solving problems at home instead. This senator’s position is closest to:","o":["interventionism","totalitarianism","the “arsenal of democracy”","isolationism"],"a":3,"t":"Isolationism"},{"id":84,"l":"1.6","q":"Which piece of evidence BEST supports the interventionist claim that freedom anywhere depends on freedom everywhere?","o":["Richard Nixon’s loss in the first televised presidential debates in 1960","FDR’s warning against buying peace “at the cost of other people’s freedom”","The New Deal’s expansion of government programs during the Depression","The boom of the American economy during the Roaring Twenties"],"a":1,"t":"The interventionism debate"},{"id":85,"l":"1.7","q":"During Watergate, President Nixon tried to withhold evidence and his campaign aides tried to hide a crime. The crisis became a real-world test of which principle — the idea that the law applies equally to everyone, including leaders?","o":["Federalism","The rule of law","Popular sovereignty","Judicial review"],"a":1,"t":"Rule of law"},{"id":86,"l":"1.7","q":"During Watergate, reporters exposed the cover-up, Congress held televised hearings, and the Supreme Court ordered the tapes released. Together, these events best illustrate…","o":["checks and balances limiting presidential power","executive privilege protecting the president","the pardon power ending a prosecution","federalism dividing power between the states and the nation"],"a":0,"t":"Checks and balances in action"},{"id":87,"l":"1.7","q":"Who became president when Richard Nixon resigned in August 1974?","o":["John Mitchell","James McCord","Gerald Ford","Mark Felt"],"a":2,"t":"Gerald Ford"},{"id":88,"l":"1.7","q":"In 1973, burglar James McCord wrote to his trial judge that others were involved in the break-in and that he had been pressured to keep quiet. His letter suggested that…","o":["the break-in was part of a larger plot someone wanted hidden","the burglars had acted alone in order to steal money","the trial had been unfair to the five burglars","the reporters had invented the story of a cover-up"],"a":0,"t":"James McCord"},{"id":89,"l":"1.7","q":"Nixon refused to hand over his White House tapes, claiming that presidents may withhold confidential information from the other branches of government. This claimed power is called…","o":["judicial review","the pardon power","the subpoena power","executive privilege"],"a":3,"t":"Executive privilege"},{"id":90,"l":"1.7","q":"What did the Supreme Court decide in United States v. Nixon (1974)?","o":["A sitting president cannot be investigated for any crime.","Executive privilege cannot block evidence needed in a criminal case.","The secretly recorded tapes could not be used in court.","The Senate had no power to hold televised hearings."],"a":1,"t":"U.S. v. Nixon"},{"id":91,"l":"1.7","q":"On June 17, 1972, five burglars were caught inside…","o":["the Democratic Party’s headquarters at the Watergate complex","the Republican campaign office near the White House","the Senate hearing room in the U.S. Capitol","the Washington Post newsroom in downtown Washington"],"a":0,"t":"The Watergate complex"},{"id":92,"l":"1.7","q":"Woodward and Bernstein traced the burglars’ cash back to Nixon’s re-election campaign, using secret leads from FBI official Mark Felt. Their investigation best illustrates which check on government power?","o":["congressional oversight of the executive branch","judicial review by the federal courts","the president’s power to veto legislation","a free press investigating public officials"],"a":3,"t":"A free press"},{"id":93,"l":"1.7","q":"John Mitchell had served as U.S. attorney general — the nation’s top law-enforcement officer — yet he went to prison for his role in Watergate. His conviction best supports which conclusion?","o":["Former officials cannot be charged with federal crimes.","The pardon protected everyone involved in the scandal.","No government office places a person above the law.","Only low-level employees were punished for Watergate."],"a":2,"t":"John Mitchell"},{"id":94,"l":"1.7","q":"A modern editorial argues: “In this country, no leader — mayor, governor, or president — can ignore a court order.” This argument most closely echoes…","o":["Madison’s claim that ambition must counteract ambition","Paine’s claim in Common Sense that “the law is king”","the Anti-Federalists’ fear of an elected king","the British idea that the monarch could do no wrong"],"a":1,"t":"Paine’s warning revisited"},{"id":95,"l":"1.7","q":"Madison wrote in Federalist No. 51 that “ambition must be made to counteract ambition.” Which Watergate event BEST matches Madison’s design?","o":["Nixon winning re-election in a historic landslide","the burglars hiding microphones in Chapstick tubes","Nixon easing Cold War tensions with China","the Supreme Court ordering the president to surrender the tapes"],"a":3,"t":"The Federalist/Anti-Federalist echo"},{"id":96,"l":"1.7","q":"A student claims: “Ford’s pardon of Nixon was bad for American democracy.” Which piece of evidence BEST supports the claim?","o":["Ford said the pardon let him focus on the whole nation’s problems.","Public support for the pardon grew in the decades afterward.","Newspapers wrote it created one justice for the powerful, another for everyone else.","Dozens of people, including top Nixon aides, went to prison."],"a":2,"t":"The pardon debate"},{"id":97,"l":"1.8","q":"In a 1974 speech answering a period of national doubt, a California governor listed America’s wealth, generosity, churches, and libraries, and described the nation as a shining example the whole world looks up to. Which speaker and symbol does this describe?","o":["Barack Obama — “A More Perfect Union”","Jeremiah Wright — his recorded sermons","Ronald Reagan — “A City on a Hill”","The Framers — the Constitution’s preamble"],"a":2,"t":"Reagan & “City on a Hill”"},{"id":98,"l":"1.8","q":"Reagan claimed a “divine plan” placed America between two oceans and called the nation “the last best hope of man on earth.” These statements best illustrate which idea?","o":["American exceptionalism","The social safety net","The two-party system","The “original sin” of slavery"],"a":0,"t":"American exceptionalism"},{"id":99,"l":"1.8","q":"Obama called the Constitution “signed but ultimately unfinished” and said each generation must narrow the gap between the nation’s ideals and its reality. This reflects which vision of democracy?","o":["Democracy as a completed achievement to defend","Democracy as an unfinished project to keep perfecting","Democracy as a religious duty owed to the founders","Democracy as a set of programs run by the government"],"a":1,"t":"“A More Perfect Union”"},{"id":100,"l":"1.8","q":"Before becoming the first Black (or biracial) U.S. President, Barack Obama served as —","o":["the governor of California","a U.S. Senator from Illinois","the pastor of a church in Chicago","the mayor of Philadelphia"],"a":1,"t":"Barack Obama"},{"id":101,"l":"1.8","q":"Which two events led many Americans in the 1970s to question whether their democracy still worked?","o":["The Vietnam War and the Watergate scandal","The Great Recession and the mortgage crisis","The Civil War and Reconstruction","The Cold War and the Great Depression"],"a":0,"t":"Crisis of confidence"},{"id":102,"l":"1.8","q":"A candidate promises a smaller federal government, lower tax rates, fewer regulations on business, and support for “traditional” social values. In modern American politics, this platform is best described as —","o":["liberal, represented by the Democratic Party","liberal, represented by the Republican Party","conservative, represented by the Democratic Party","conservative, represented by the Republican Party"],"a":3,"t":"Conservative"},{"id":103,"l":"1.8","q":"Which political position generally favors a larger government offering more services — a “social safety net” of programs like unemployment benefits and food stamps — paid for by higher taxes on corporations and the wealthy?","o":["Liberal, represented by the Democratic Party","Liberal, represented by the Republican Party","Conservative, represented by the Democratic Party","Conservative, represented by the Republican Party"],"a":0,"t":"Liberal & the social safety net"},{"id":104,"l":"1.8","q":"By the mid-20th century, American politics had sorted so that conservatives were generally represented by one major party and liberals by the other. This arrangement is called —","o":["the social safety net","the crisis of confidence","the two-party system","American exceptionalism"],"a":2,"t":"The two-party system"},{"id":105,"l":"1.8","q":"Reagan pointed to “that little hall of Philadelphia,” and Obama spoke “across the street” from the same building where the Framers wrote the Constitution in 1787. What does the two speakers’ shared focus on Independence Hall suggest?","o":["The two major parties now agree on most major policy questions","Both parties compete to claim the founding as a symbol for their vision of democracy","Only conservatives still treat the Framers as central to American democracy","Both speeches were delivered inside Independence Hall rather than at other sites"],"a":1,"t":"Independence Hall"},{"id":106,"l":"1.8","q":"Obama delivered “A More Perfect Union” partly in response to controversy over Jeremiah Wright. Wright mattered to the speech because —","o":["he wrote the speech and coached Obama’s delivery of it","he ran against Obama as an opponent in the 2008 election","his critical sermons forced Obama to explain seeing America’s flaws while still believing in its democracy","his recorded sermons celebrated American exceptionalism too enthusiastically"],"a":2,"t":"Jeremiah Wright"},{"id":107,"l":"1.8","q":"A mayor giving a Fourth of July speech says: “Tonight we honor what our town has already achieved — we are an example other towns look up to.” The mayor’s approach to celebration most resembles —","o":["Obama’s framing: reflect on the work that remains unfinished","Jeremiah Wright’s framing: focus on the community’s failures","the Framers’ framing: leave hard questions to future generations","Reagan’s framing: celebrate achievements as proof of greatness"],"a":3,"t":"The Celebration Debate"},{"id":108,"l":"1.8","q":"A student claims that celebrating democracy should focus on reflecting on unfinished work rather than on achievements. Which piece of evidence BEST supports the student’s claim?","o":["America publishes more books than all other nations put together","Reagan came to be known as the “Great Communicator”","The Constitution was signed in Philadelphia in 1787","Segregated schools remained inferior decades after Brown v. Board of Education"],"a":3,"t":"The Celebration Debate"}];

function missedIds(){ return Object.keys(store.hist).filter(id => store.hist[id].seen > store.hist[id].right).map(Number); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

// ---- header ----
function renderLessons(){
  const el = $("#lessons"); el.innerHTML = "";
  const mk = (code,label) => { const b=document.createElement("button"); b.textContent=label; b.setAttribute("aria-pressed", store.lessons.includes(code)); b.onclick=()=>{
    if(code==="all") store.lessons=["all"];
    else { store.lessons = store.lessons.filter(c=>c!=="all"); store.lessons.includes(code) ? store.lessons=store.lessons.filter(c=>c!==code) : store.lessons.push(code); if(!store.lessons.length) store.lessons=["all"]; }
    save(); renderLessons(); home(); }; el.appendChild(b); };
  mk("all","All lessons"); Object.keys(LESSONS).forEach(c=>mk(c, c+" "+LESSONS[c]));
}
$("#mode-practice").onclick = ()=>setMode("practice");
$("#mode-cards").onclick = ()=>setMode("cards");
function setMode(m){ store.mode=m; save(); $("#mode-practice").setAttribute("aria-pressed", m==="practice"); $("#mode-cards").setAttribute("aria-pressed", m==="cards"); home(); }

// ---- home / setup ----
function home(){
  const p = pool(); const seen = Object.keys(store.hist).length; const missed = missedIds().filter(id=>p.some(q=>q.id===id));
  const v = $("#view"); v.className="";
  if(store.mode==="practice"){
    const total = Object.values(store.hist).reduce((a,h)=>a+h.seen,0), right = Object.values(store.hist).reduce((a,h)=>a+h.right,0);
    v.innerHTML = `<div class="setup">
      <h2>Practice test</h2>
      <p>Multiple choice, same questions as the content quizzes. You get the answer and the key idea after every question. ${p.length} questions available in the lessons you picked.</p>
      <div class="row"><label>Questions</label><div class="seg" id="len">${[10,20,40,p.length].filter((n,i,a)=>a.indexOf(n)===i && n<=p.length).map(n=>`<button data-n="${n}" aria-pressed="${store.len===n}">${n===p.length?"All "+n:n}</button>`).join("")}</div></div>
      <div class="row"><button class="cta" id="start">Start practice</button>
        <button class="cta secondary" id="start-missed" ${missed.length?"":"disabled"}>Retry missed (${missed.length})</button></div>
      ${seen?`<div class="stats"><div class="stat"><b>${total?Math.round(100*right/total):0}%</b><span>all-time accuracy</span></div><div class="stat"><b>${seen}</b><span>of 108 questions tried</span></div><div class="stat"><b>${weakest()}</b><span>weakest lesson</span></div></div>`:`<p class="muted">Your results stay on this device so you can come back and retry what you missed.</p>`}
    </div>`;
    v.querySelectorAll("#len button").forEach(b=>b.onclick=()=>{ store.len=+b.dataset.n; save(); home(); });
    if(!v.querySelector('#len [aria-pressed="true"]')) { store.len = Math.min(store.len, p.length); const b=v.querySelector(`#len [data-n="${store.len}"]`)||v.querySelector("#len button"); if(b){store.len=+b.dataset.n; b.setAttribute("aria-pressed","true");} }
    $("#start").onclick = ()=>startPractice(shuffle(p).slice(0, store.len));
    $("#start-missed").onclick = ()=>startPractice(shuffle(p.filter(q=>missed.includes(q.id))));
  } else {
    const got = p.filter(q=>store.cards[q.id]==="got").length, miss = p.filter(q=>store.cards[q.id]==="miss").length;
    v.innerHTML = `<div class="setup">
      <h2>Flashcards</h2>
      <p>Question on the front, answer and key idea on the back. Tap to flip, then mark it. Cards you miss come back first next time.</p>
      <div class="row"><button class="cta" id="deck">Study all (${p.length})</button><button class="cta secondary" id="deck-missed" ${miss?"":"disabled"}>Missed only (${miss})</button></div>
      <div class="stats"><div class="stat"><b>${got}</b><span>marked got it</span></div><div class="stat"><b>${miss}</b><span>marked missed</span></div><div class="stat"><b>${p.length-got-miss}</b><span>not yet seen</span></div></div>
    </div>`;
    $("#deck").onclick = ()=>startCards(shuffle(p).sort((a,b)=>(store.cards[a.id]==="miss"?0:store.cards[a.id]?2:1)-(store.cards[b.id]==="miss"?0:store.cards[b.id]?2:1)));
    $("#deck-missed").onclick = ()=>startCards(shuffle(p.filter(q=>store.cards[q.id]==="miss")));
  }
  $("#foot").innerHTML = `Questions come from the Unit 1 content quizzes (lessons 1.1–1.8). <button id="reset">Clear my results on this device</button>`;
  $("#reset").onclick = ()=>{ store.hist={}; store.cards={}; save(); home(); };
}
function weakest(){
  const by={}; DATA.forEach(q=>{ const h=store.hist[q.id]; if(!h) return; by[q.l]=by[q.l]||{s:0,r:0}; by[q.l].s+=h.seen; by[q.l].r+=h.right; });
  let w=null,wr=2; Object.keys(by).forEach(l=>{ const r=by[l].r/by[l].s; if(by[l].s>=3 && r<wr){wr=r;w=l;} });
  return w ? w : "—";
}

// ---- practice ----
let run = null; // {qs, i, answers:[{id, pick, ok}], order:[]}
function startPractice(qs){ if(!qs.length) return home(); run={qs,i:0,answers:[]}; showQ(); }
function showQ(){
  const q = run.qs[run.i]; const order = shuffle([0,1,2,3]); run.order = order;
  const v=$("#view"); v.className="";
  v.innerHTML = `<div class="progress"><span>Question ${run.i+1} of ${run.qs.length}</span><span>${run.answers.filter(a=>a.ok).length} correct</span></div><div class="bar"><i style="width:${100*run.i/run.qs.length}%"></i></div>
    <div class="tag">${q.l} ${LESSONS[q.l]}</div>
    <p class="stem">${esc(q.q)}</p>
    <ul class="opts">${order.map((oi,k)=>`<li><button class="opt" data-oi="${oi}"><span class="k">${L[k]}</span><span>${esc(q.o[oi])}</span></button></li>`).join("")}</ul>
    <div id="fb"></div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  window.scrollTo({top:0});
}
function answer(oi){
  const q=run.qs[run.i]; const ok = oi===q.a;
  run.answers.push({id:q.id, pick:oi, ok});
  const h = store.hist[q.id] = store.hist[q.id]||{seen:0,right:0}; h.seen++; if(ok) h.right++; save();
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const o=+b.dataset.oi; if(o===q.a) b.classList.add("correct"); else if(o===oi) b.classList.add("wrong"); else b.classList.add("dim"); });
  const last = run.i===run.qs.length-1;
  $("#fb").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><b>${ok?"Correct.":"Not quite."}</b>${ok?"":"The answer is "+L[run.order.indexOf(q.a)]+": "+esc(q.o[q.a])+"."}<div class="t">Key idea: ${esc(q.t)}</div></div>
    <div class="actions"><button class="cta" id="next">${last?"See results":"Next question"}</button><span class="kbd"><kbd>Enter</kbd> next</span></div>`;
  $("#next").onclick = next; $("#next").focus({preventScroll:true});
}
function next(){ if(run.i===run.qs.length-1) return results(); run.i++; showQ(); }
function results(){
  const n=run.qs.length, r=run.answers.filter(a=>a.ok).length;
  const by={}; run.qs.forEach((q,i)=>{ by[q.l]=by[q.l]||{n:0,r:0}; by[q.l].n++; if(run.answers[i].ok) by[q.l].r++; });
  const missed = run.qs.filter((q,i)=>!run.answers[i].ok);
  const v=$("#view"); v.className="results";
  v.innerHTML = `<h2>Results</h2><div class="score">${r}<small> / ${n} &nbsp;(${Math.round(100*r/n)}%)</small></div>
    <table><thead><tr><th>Lesson</th><th class="n">Right</th><th class="n">Asked</th></tr></thead><tbody>
    ${Object.keys(by).sort().map(l=>`<tr class="${by[l].r/by[l].n<0.6?"weak":""}"><td>${l} ${LESSONS[l]}</td><td class="n">${by[l].r}</td><td class="n">${by[l].n}</td></tr>`).join("")}</tbody></table>
    <div class="actions"><button class="cta" id="again">New practice test</button>${missed.length?`<button class="cta secondary" id="retry">Retry these ${missed.length} missed</button>`:""}</div>
    ${missed.length?`<ul class="missedlist">${missed.map(q=>`<li><span class="tag">${q.l} · ${esc(q.t)}</span><br>${esc(q.q)}<b>${esc(q.o[q.a])}</b></li>`).join("")}</ul>`:""}`;
  $("#again").onclick = home; const rt=$("#retry"); if(rt) rt.onclick=()=>startPractice(shuffle(missed));
  window.scrollTo({top:0});
}

// ---- flashcards ----
let deck=null;
function startCards(qs){ if(!qs.length) return home(); deck={qs,i:0,flipped:false}; showCard(); }
function showCard(){
  const q=deck.qs[deck.i]; const v=$("#view"); v.className="";
  v.innerHTML = `<div class="progress"><span>Card ${deck.i+1} of ${deck.qs.length}</span><span>${q.l} ${LESSONS[q.l]}</span></div><div class="bar"><i style="width:${100*deck.i/deck.qs.length}%"></i></div>
    <button class="card ${deck.flipped?"back":""}" id="card" aria-live="polite">${deck.flipped
      ? `<div class="side">Answer</div><div class="ans">${esc(q.o[q.a])}</div><div class="t">Key idea: ${esc(q.t)}</div>`
      : `<div class="side">Question · tap to flip</div><p class="stem">${esc(q.q)}</p>`}</button>
    <div class="judge"><button class="miss" id="miss" ${deck.flipped?"":"disabled"}>Missed it</button><button class="got" id="got" ${deck.flipped?"":"disabled"}>Got it</button></div>
    <div class="actions"><button class="cta secondary" id="quit">Back</button><span class="kbd"><kbd>Space</kbd> flip · <kbd>1</kbd> missed · <kbd>2</kbd> got it</span></div>`;
  $("#card").onclick=flip; $("#miss").onclick=()=>judge("miss"); $("#got").onclick=()=>judge("got"); $("#quit").onclick=home;
}
function flip(){ deck.flipped=!deck.flipped; showCard(); }
function judge(v){ store.cards[deck.qs[deck.i].id]=v; save(); if(deck.i===deck.qs.length-1){ deck=null; return home(); } deck.i++; deck.flipped=false; showCard(); }

// ---- keys ----
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(run && run.i < run.qs.length){
    const k=e.key.toUpperCase(); const idx = "ABCD".indexOf(k)>=0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
    if(idx>=0 && !$("#next")){ const b=document.querySelectorAll(".opt")[idx]; if(b) b.click(); }
    if(e.key==="Enter" && $("#next")) $("#next").click();
  }
  if(deck){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } if(deck.flipped && e.key==="1") judge("miss"); if(deck.flipped && e.key==="2") judge("got"); if(e.key==="Escape") home(); }
});

// ---- boot ----
if(location.hash==="#flashcards") store.mode="cards"; else if(location.hash==="#practice") store.mode="practice";
$("#mode-practice").setAttribute("aria-pressed", store.mode==="practice"); $("#mode-cards").setAttribute("aria-pressed", store.mode==="cards");
renderLessons(); home();
</script>
